<svg xmlns="http://www.w3.org/2000/svg" viewBox="-24 0 574 180" fill="none">
  <defs>
    <!-- Red gradient for circle -->
    <linearGradient id="celebalRed" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#EE3026"/>
      <stop offset="100%" stop-color="#BE181E"/>
    </linearGradient>

    <!-- Subtle mesh pattern for the circle texture -->
    <pattern id="dotPattern" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <circle cx="2" cy="2" r="0.75" fill="#FFFFFF" fill-opacity="0.12"/>
      <circle cx="5" cy="5" r="0.75" fill="#000000" fill-opacity="0.12"/>
    </pattern>

    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="1.5" dy="2.5" stdDeviation="3.5" flood-color="#BE181E" flood-opacity="0.22"/>
    </filter>
  </defs>

  <!-- Left Red Emblem with CT monogram - generously padded so it never clips -->
  <g transform="translate(12, 8)" filter="url(#softShadow)">
    <!-- Base Red Circle -->
    <circle cx="82" cy="82" r="76" fill="url(#celebalRed)"/>
    <!-- Texture overlay -->
    <circle cx="82" cy="82" r="76" fill="url(#dotPattern)"/>

    <!-- Slanted CT Monogram -->
    <g transform="translate(82, 82) skewX(-14) translate(-82, -82)">
      <!-- 'C' Shape -->
      <path d="M 72 46
               L 42 46
               C 34 46, 28 52, 28 60
               L 28 104
               C 28 112, 34 118, 42 118
               L 72 118
               C 77 118, 80 115, 80 110
               L 80 102
               C 80 98, 77 96, 72 96
               L 49 96
               C 46 96, 44 94, 44 91
               L 44 73
               C 44 70, 46 68, 49 68
               L 72 68
               C 77 68, 80 65, 80 60
               L 80 54
               C 80 49, 77 46, 72 46 Z"
            fill="#FFFFFF"/>

      <!-- 'T' Shape -->
      <path d="M 88 68
               L 138 68
               C 142 68, 145 71, 145 75
               L 145 83
               C 145 87, 142 90, 138 90
               L 122 90
               L 122 128
               C 122 133, 118 136, 114 136
               L 100 136
               C 96 136, 93 133, 93 128
               L 93 90
               L 88 90
               C 84 90, 81 87, 81 83
               L 81 75
               C 81 71, 84 68, 88 68 Z"
            fill="#FFFFFF"/>
    </g>
  </g>

  <!-- Right Typography: CELEBAL TECHNOLOGIES -->
  <g transform="translate(198, 0)">
    <!-- CELEBAL wordmark -->
    <text x="0" y="102" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="900" font-size="88" fill="#1C1B1F" letter-spacing="-1.5">
      <tspan font-size="100" dy="4">C</tspan><tspan dy="-4">ELEBAL</tspan>
    </text>

    <!-- Thin Divider Line -->
    <line x1="8" y1="120" x2="330" y2="120" stroke="#222222" stroke-width="1.8" stroke-linecap="round"/>

    <!-- TECHNOLOGIES subtitle -->
    <text x="14" y="156" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Montserrat', sans-serif" font-weight="700" font-size="33" fill="#1C1B1F" letter-spacing="9">
      TECHNOLOGIES
    </text>
  </g>
</svg>
